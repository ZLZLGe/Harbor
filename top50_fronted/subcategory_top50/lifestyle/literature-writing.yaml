  id: baojie-shiji-kb-labs-sima-qian-style-skill-md
  name: sima-qian-style
  author: baojie
  stars: 636
  forks: 82
  description: '将现代文本改写为司马迁《史记》文笔风格。


    **触发场景**（主动使用）：

    - 用户明确要求"用太史公文笔改写"、"以史记风格写..."、"太史公曰"、"列传体"

    - 用户要求将现代文本转为文言文，且强调古雅、简洁、有文史韵味

    - 用户提供人物传记、历史事件、技术概念等素材，要求古风改写

    - 用户询问"司马迁会怎么写这件事"


    **功能**：

    - 三层转换：现代名词古化 → 白话转文言 → 太史公风格

    - 应用《史记》特有句式（开篇定式、层递并列、简短断言、对话穿插动作等）

    - 应用《史记》修辞（白描、先抑后扬、排比对仗、跳跃式剪辑等）

    - 可选输出"太史公曰"评论段（50-80字精简版）


    **不做什么**：

    - 不复述《史记》原文内容

    - 不模拟司马迁的历史观点

    - 不套用《史记》名句

    - 只学习语言形式、句法结构、修辞节奏


    本技能基于《史记》130篇语料分析，适用于人物传记、历史事件、技术概念等现代素材的古风改写。'
  github_url: https://github.com/baojie/shiji-kb/tree/main/labs/sima-qian-style
  updated_at: '1774455286'
