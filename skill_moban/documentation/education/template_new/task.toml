version = "1.0"

[metadata]
id = "education__course-incident-learning-capture"
name = "Template: Course Incident Learning Capture"
description = "Convert a realistic educational-content production incident into a reusable agent skill with evidence-backed procedures and generalizable quality checks."
difficulty = "hard"
category = "education"
tags = [
  "education",
  "documentation",
  "skill-authoring",
  "curriculum-operations",
  "course-quality",
  "knowledge-capture",
  "incident-learning",
]
required_skills = [
  "update-skills",
]
distractor_skills = [
  "technical-writer",
  "rules-distill",
  "skill-writer",
]
primary_output_file = "/outputs/lesson_skill/SKILL.md"
source_template_id = "education__course-incident-learning-capture"
task_role = "template"

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
allow_internet = true
