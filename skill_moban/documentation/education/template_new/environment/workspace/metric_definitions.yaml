metrics:
  - name: completion_rate
    definition: Unique learners with a `lesson_completed` event divided by unique learners with a `session_started` event.
    numerator_event: lesson_completed
    denominator_event: session_started
    grain: learner
    format: percent
    common_trap: Counting raw events instead of distinct learners.
  - name: practice_submission_rate
    definition: Unique learners with a `practice_submitted` event divided by unique learners who opened practice.
    numerator_event: practice_submitted
    denominator_event: practice_opened
    grain: learner
    format: percent
    common_trap: Using session starts as the denominator.
  - name: quiz_pass_rate
    definition: Unique learners with at least one passing quiz attempt divided by unique learners with at least one quiz attempt.
    grain: learner
    format: percent
    common_trap: Averaging pass flags across attempts instead of rolling up to the learner level first.
  - name: retry_rate
    definition: Unique learners with more than one quiz attempt divided by unique learners with at least one quiz attempt.
    grain: learner
    format: percent
    common_trap: Dividing retry attempts by total attempts instead of dividing retrying learners by attempting learners.
