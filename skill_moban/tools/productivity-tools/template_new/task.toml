version = "1.0"

[metadata]
id = "productivity_tools__developer_feed_digest"
name = "Template: Developer Feed Digest"
description = "Build a structured morning digest from mirrored blog feeds and article pages for a developer productivity team."
difficulty = "hard"
category = "productivity-tools"
tags = [
  "productivity",
  "rss",
  "atom",
  "feed-monitoring",
  "triage",
  "content-analysis"
]
required_skills = ["blogwatcher"]
primary_output_file = "/app/output/feed_digest.json"
source_template_id = "productivity_tools__developer_feed_digest"
task_role = "template"

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = true
