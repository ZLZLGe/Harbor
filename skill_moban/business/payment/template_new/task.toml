version = "1.0"

[metadata]
id = "payment__renewal-batch-processor"
name = "Template: Renewal Batch Processor"
description = "Complete a local subscription billing batch processor that calculates renewal charges, current-cycle adjustments, taxes, and action routing."
difficulty = "hard"
category = "payment"
tags = [
  "payment",
  "billing-automation",
  "subscriptions",
  "renewals",
  "invoicing",
  "dunning",
  "proration",
  "usage-billing",
]
required_skills = [
  "billing-automation",
]
distractor_skills = [
  "stripe-integration",
  "invoice-generator",
  "revenue-operations",
]
primary_output_file = "/root/output/billing_run_summary.json"
source_template_id = "payment__renewal-batch-processor"
task_role = "template"

[agent]
timeout_sec = 600.0

[solution]
timeout_sec = 900.0

[verifier]
timeout_sec = 900.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
