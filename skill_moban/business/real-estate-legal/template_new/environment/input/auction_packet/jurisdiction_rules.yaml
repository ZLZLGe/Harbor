jurisdiction: Arizona nonjudicial trustee sale
effective_for_packet: AZ-MARICOPA-TR-2026-0417-78
priority_rules:
  foreclosing_instrument:
    source_id: REC-2019-0441821
    recorded_date: "2019-06-14"
    rule: Claims recorded before this instrument are senior unless released or subordinated. Claims recorded after this instrument are junior unless a statute in this file gives them priority.
  property_tax:
    priority: senior
    treatment: survives_sale
    note: Delinquent county property taxes are not extinguished by the trustee sale.
  municipal_assessment:
    priority: senior
    treatment: survives_sale
    note: Recorded nuisance-abatement, water, sewer, and municipal assessment charges survive unless the packet contains a written release.
  hoa_superpriority:
    priority: senior
    treatment: survives_sale
    amount_rule: Six months of regular assessments immediately before the sale date survive as a superpriority amount. Late fees, collection costs, attorney fees, and older assessments are junior unless another rule applies.
  federal_tax_lien:
    priority: junior
    treatment: extinguished_by_sale
    risk_note: If proper notice was served, the lien does not survive as a payment claim, but the United States may retain a statutory redemption period after sale.
  judgment_lien:
    priority: junior
    treatment: extinguished_by_sale
  released_lien:
    treatment: extinguished_by_sale
    note: A released claim should not be included in surviving debt.
  fixture_filing:
    priority: junior
    treatment: requires_counsel_review
    note: A recorded leased-equipment or fixture filing after the foreclosing instrument is a counsel-review and possession/title condition, but it is not treated as an unknown senior or surviving monetary debt unless the packet includes a payoff demand, lease assumption amount, or statutory survival rule.
sale_status_rules:
  active_sale:
    rule: Treat the sale as active if the most recent trustee notice confirms the sale date and there is no later cancellation, postponement, or active stay.
  bankruptcy:
    active_stay: An open bankruptcy with an automatic stay before sale makes sale_status stayed.
    dismissed_case: A dismissed bankruptcy is not an active stay, but should be disclosed as a risk if recent.
  notice_defect:
    corrected_notice: A corrected notice cures an earlier clerical APN error if it was recorded before the sale and no later objection remains open.
valuation_rules:
  floor_to_nearest_100: Round the computed maximum bid down to the nearest 100 dollars.
  surviving_debt_total: Include claims with treatment survives_sale or requires_counsel_review when the amount is known.
recommendation_rules:
  do_not_bid_if:
    - active bankruptcy stay
    - cancelled sale
    - missing authority to sell
    - unresolved blocker risk
    - unknown senior or surviving debt that could materially exceed the equity cushion
  bid_with_conditions_if:
    - economically viable but counsel confirmation, payoff confirmation, redemption planning, or possession planning remains necessary
