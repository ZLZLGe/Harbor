version = "1.0"

[metadata]
id = "sales-marketing__retail-replenishment-planning"
name = "Template: Retail Replenishment Planning"
description = "Build an 8-week store-level replenishment plan from public-source-derived demand history, store and SKU rules, supplier constraints, promotions, and a capped current-cycle review set."
difficulty = "hard"
category = "sales-marketing"
tags = [
  "sales-marketing",
  "inventory-planning",
  "demand-forecasting",
  "replenishment",
  "retail-operations",
  "promotions",
  "budgeting",
]
required_skills = [
  "inventory-demand-planning",
]
primary_output_file = "/app/output/planning_summary.json"
source_template_id = "sales-marketing__retail-replenishment-planning"
task_role = "template"

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
