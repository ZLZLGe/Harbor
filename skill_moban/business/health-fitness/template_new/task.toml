version = "1.0"

[metadata]
id = "health-fitness__strength-cycle-meal-plan"
name = "Template: Strength Cycle and Meal Plan"
description = "Prepare a compliant 4-day strength split and 2-day repeatable meal plan from current planning inputs and older shortlist exports."
difficulty = "hard"
category = "health-fitness"
tags = [
  "health-fitness",
  "strength-training",
  "nutrition-planning",
  "meal-prep",
  "macro-targets",
  "exercise-selection",
  "coach-handoff",
]
required_skills = [
  "fitness-nutrition",
]
primary_output_file = "/root/output/plan_summary.json"
source_template_id = "health-fitness__strength-cycle-meal-plan"
task_role = "template"

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
