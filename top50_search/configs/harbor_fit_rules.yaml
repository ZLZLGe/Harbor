harbor_fit_rules:
  capability_boundary:
    description: Measures whether the candidate skill stays inside data-quality goals instead of wandering into meta or management actions.
    positive_signals:
      - data_objective_clarity
      - schema_scope
      - data_engineering_ownership
    negative_signals:
      - registry_or_session_focus
      - installation_or_publication_flow
  environment_reproducibility:
    description: Captures deterministic inputs/resources so the same data-quality checks can be replayed.
    positive_signals:
      - deterministic_configuration
      - resource_specified
    negative_signals:
      - vague_exploration
      - marketplace_or_dispatcher_dependency
  verifier_stability:
    description: Ensures the verification logic can be rerun with consistent pass/fail gates.
    positive_signals:
      - explicit_thresholds
      - automated_checks
    negative_signals:
      - heuristic_judgment
      - exploratory_only
