domains:
  - slug: data-ml-engineering
    name: Data ML Engineering
    description: Primary domain covering data governance, quality, and engineering workflows.

search_buckets:
  - slug: data-quality
    name: Data Quality
    domain: data-ml-engineering
    description: Initial bucket for experiments around schema validation, dataset cleaning, and reconciliation practices.
    seed_queries:
      - data quality
      - data validation
      - schema validation
      - dataset cleaning
      - table reconciliation
    expand_queries:
      - deduplication
      - consistency check
      - anomaly detection
      - record matching
      - data audit
      - missing values
    exclude_terms:
      - install skill
      - publish skill
      - registry
      - marketplace
      - agent dispatcher
      - session manager
      - search skills
      - workflow hub
    candidate_limit: 100
    target_limit: 50
