name: Service analysis CI

on:
  pull_request:
    paths:
      - "services/**"
      - ".github/workflows/**"

jobs:
  analyze-service:
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            python-version: "3.10"
          - service: worker
            python-version: "3.11"
    uses: ./.github/workflows/reusable-service-analysis.yml
    with:
      service_name: ${{ matrix.service }}
      python-version: ${{ matrix.python-version }}
      artifact_prefix: ${{ matrix.service }}-${{ matrix.python-version }}

  publish-analysis-summary:
    needs:
      - analyze-service
    runs-on: ubuntu-latest
    steps:
      - name: Publish summary
        run: echo "publishing summary for all analyzed services"
