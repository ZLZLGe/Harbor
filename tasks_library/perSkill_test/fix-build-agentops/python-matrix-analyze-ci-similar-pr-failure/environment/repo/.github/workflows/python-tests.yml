name: Python Tests

on:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: |
          PYTHONPATH=src MATRIX_PYTHON_VERSION=${{ matrix.python-version }} python -m unittest -v tests.test_summary
