description = "Update a broken GitHub Actions Python workflow to install from the repository lockfile and run the test suite through the modern project workflow."
author_name = "OpenAI"
author_email = "support@openai.com"
difficulty = "easy"
category = "CI/CD"
tags = [
  "Python",
  "GitHub Actions",
  "CI",
  "workflow",
  "uv",
]
