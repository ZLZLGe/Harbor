version = "1.0"

[metadata]
id = "delivery-robot-vehicle-dynamics-transfer-zone-speed-profile"
name = "Transfer | Delivery Robot Zone Speed Profile"
description = "Simulate a campus delivery robot across zoned speed limits and docking buffers, then write segment-speed and stop-error metrics to zone_speed_profile_metrics.yaml."
author_name = "Jiachen Li"
author_email = "jiachenli@utexas.edu"
difficulty = "medium"
category = "robotics"
tags = ["python", "vehicle-dynamics", "robotics", "simulation", "speed-profile"]
primary_output_file = "zone_speed_profile_metrics.yaml"
source_task_id = "adaptive-cruise-control"
task_role = "transfer"

[verifier]
