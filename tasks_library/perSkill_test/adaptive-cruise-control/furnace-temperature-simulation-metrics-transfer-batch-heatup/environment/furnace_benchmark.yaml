target_temperature_c: 850.0

phases:
  heatup:
    start_time_min: 0.0
    end_time_min: 80.0
    settling_tolerance: 0.015
  recovery:
    start_time_min: 90.0
    end_time_min: 140.0
    settling_tolerance: 0.05

gates:
  heatup_rise_time_max_min: 32.0
  heatup_overshoot_max_pct: 1.0
  heatup_steady_state_error_max_c: 3.0
  heatup_settling_time_max_min: 50.0
  recovery_floor_min_c: 735.0
  recovery_rise_time_max_min: 14.0
  recovery_overshoot_max_pct: 1.0
  recovery_steady_state_error_max_c: 0.1
  recovery_settling_time_max_min: 20.0

score_normalizers:
  heatup_rise_time_min: 32.0
  heatup_overshoot_pct: 1.0
  heatup_steady_state_error_c: 3.0
  heatup_settling_time_min: 50.0
  recovery_rise_time_min: 14.0
  recovery_overshoot_pct: 1.0
  recovery_steady_state_error_c: 0.1
  recovery_settling_time_min: 20.0
