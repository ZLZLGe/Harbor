version = "1.0"

[metadata]
id = "network-obspy-data-api-transfer-station-availability"
name = "Network Transfer Station Availability Audit"
description = "Audit StationXML channel metadata against MiniSEED waveform coverage and write a grouped JSON availability report to /root/network_availability.json."
author_name = "OpenAI Codex"
author_email = "codex@openai.com"
difficulty = "medium"
category = "seismology"
tags = ["seismology", "stationxml", "miniseed", "network-qa", "availability"]
primary_output_file = "/root/network_availability.json"
source_task_id = "earthquake-phase-association"
