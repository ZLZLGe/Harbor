harbor_fit_rules:
  capability_boundary:
    description: Measures whether the candidate skill has a bounded bucket fit instead of drifting into meta workflows or broad orchestration.
    positive_signals:
      - data_objective_clarity
      - schema_scope
      - data_engineering_ownership
    negative_signals:
      - registry_or_session_focus
      - installation_or_publication_flow
  environment_reproducibility:
    description: Captures whether the environment can be reproduced locally from concrete assets without fragile external dependencies.
    positive_signals:
      - deterministic_configuration
      - resource_specified
    negative_signals:
      - vague_exploration
      - marketplace_or_dispatcher_dependency
  verifier_stability:
    description: Ensures the task can expose explicit outputs, tolerances, and edge cases so verifier checks stay deterministic.
    positive_signals:
      - explicit_thresholds
      - automated_checks
    negative_signals:
      - heuristic_judgment
      - exploratory_only
